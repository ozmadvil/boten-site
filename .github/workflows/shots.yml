name: Site screenshots (marketing)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "playwright==1.55.0" && python -m playwright install --with-deps chromium
      - run: python qa/shots.py
        env:
          QA_TOKEN: ${{ secrets.QA_TOKEN }}
      - name: Keep the screenshots on the qa-reports branch
        run: |
          set -e
          cp -r qa/shots /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin qa-reports
          git checkout -B qa-reports origin/qa-reports
          rm -rf shots && cp -r /tmp/shots shots
          git add -A shots && git commit -qm "Marketing screenshots" && git push origin qa-reports
