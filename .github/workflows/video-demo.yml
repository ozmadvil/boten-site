name: Marketing video demo

on:
  push:
    branches: [video-demo]
    paths: ["marketing/**", ".github/workflows/video-demo.yml"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install "pillow==12.3.0" "python-bidi==0.6.12" "fonttools==4.67.0" "brotli==1.2.1"
      - run: mkdir -p out && python marketing/make_video.py marketing/demo.json out/nicebuy-demo.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nicebuy-demo
          path: out/*.*
          retention-days: 7
