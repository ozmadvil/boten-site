name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"        # hourly: new channel deals appear as tiles, expired codes drop off
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install share-card tools
        run: pip install "pillow>=10" "python-bidi>=0.5" fonttools brotli
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          CNAME: ${{ vars.CNAME }}
          BOT_FEED_URL: ${{ vars.BOT_FEED_URL || 'https://worker-production-b0bb.up.railway.app/products.json' }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
