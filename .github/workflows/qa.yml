name: Site chat check (like a shopper)

on:
  schedule:
    - cron: "11 2 * * *"        # 04:11 Israel (winter), before the nightly code-fix task reads the results
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["qa/**", ".github/workflows/qa.yml"]

permissions:
  contents: write

concurrency:
  group: site-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "playwright==1.55.0" && python -m playwright install --with-deps chromium
      - run: python qa/site_qa.py "https://nicebuy.co.il/"
      - name: Keep the report on the qa-reports branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/rep && cp -r qa/out/. /tmp/rep/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin qa-reports || true
          if git rev-parse --verify origin/qa-reports >/dev/null 2>&1; then git checkout -B qa-reports origin/qa-reports; else git checkout --orphan qa-reports && git rm -rqf . ; fi
          day=$(date -u +%F-%H%M)
          mkdir -p "runs/$day" && cp -r /tmp/rep/. "runs/$day/" && cp -r /tmp/rep/. latest/ 2>/dev/null || (mkdir -p latest && cp -r /tmp/rep/. latest/)
          git add -A runs latest && git commit -qm "Site QA $day" && git push origin qa-reports
